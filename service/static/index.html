<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocLayout-YOLO 检测服务</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; }
    .drop-zone { border: 2px dashed #999; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: #fafafa; }
    .drop-zone.dragging { background: #e8f0fe; border-color: #4285f4; }
    .params { display: grid; grid-template-columns: 120px 1fr 60px; gap: 8px 12px; margin: 20px 0; align-items: center; }
    .params label { text-align: right; }
    button { background: #4285f4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin: 12px 0; padding: 10px; border-radius: 4px; display: none; }
    .status.show { display: block; }
    .status.loading { background: #fff3cd; color: #856404; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.success { background: #d4edda; color: #155724; }
    .result { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .result img { max-width: 100%; border: 1px solid #ddd; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
    th { background: #f5f5f5; }
    .tabs { display: flex; gap: 4px; margin: 16px 0; border-bottom: 1px solid #ddd; }
    .tab { padding: 8px 16px; background: #f0f0f0; border: 1px solid #ddd; border-bottom: none; cursor: pointer; }
    .tab.active { background: #fff; border-bottom: 1px solid #fff; margin-bottom: -1px; font-weight: bold; }
    .crops-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .crop-item { border: 1px solid #ddd; padding: 3px; max-width: 200px; font-size: 11px; }
    .crop-item img { max-width: 180px; max-height: 80px; display: block; }
    .crop-item .crop-txt { margin-top: 2px; word-break: break-all; color: #555; }
    .exam-total-time {
      display: inline-block;
      margin: -8px 0 12px;
      padding: 6px 12px;
      background: #e7f3ff;
      color: #084c8d;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>DocLayout-YOLO 检测服务</h1>

  <div class="tabs">
    <button class="tab active" data-tab="general">通用版面</button>
    <button class="tab" data-tab="exam">试卷模式</button>
  </div>

  <div id="tab-general" class="tab-content">
    <div id="dropZone" class="drop-zone">拖拽图片到这里,或点击选择</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="params">
      <label for="confRange">conf 阈值</label>
      <input type="range" id="confRange" min="0" max="1" step="0.05" value="0.2">
      <output id="confOut">0.2</output>

      <label for="imgszRange">imgsz</label>
      <input type="range" id="imgszRange" min="320" max="2048" step="32" value="1024">
      <output id="imgszOut">1024</output>

      <label for="lineRange">框线粗细</label>
      <input type="range" id="lineRange" min="1" max="20" step="1" value="5">
      <output id="lineOut">5</output>

      <label for="fontRange">标签字号</label>
      <input type="range" id="fontRange" min="8" max="50" step="1" value="20">
      <output id="fontOut">20</output>
    </div>

    <button id="submitBtn" disabled>开始检测</button>

    <div id="status" class="status"></div>

    <h2 id="summary" style="display:none">检测结果</h2>
    <div class="result" id="result" style="display:none">
      <div>
        <p>标注图:</p>
        <img id="annotatedImg">
        <p><a id="downloadLink" download="annotated.jpg">下载标注图</a></p>
      </div>
      <div>
        <p>原图:</p>
        <img id="originalImg">
      </div>
    </div>

    <table id="detectionTable" style="display:none">
      <thead><tr><th>#</th><th>类别</th><th>置信度</th><th>坐标 (x1, y1, x2, y2)</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="tab-exam" class="tab-content" style="display:none">
    <h2>试卷版面识别</h2>
    <div id="dropZoneExam" class="drop-zone">拖拽试卷图片到这里,或点击选择</div>
    <input type="file" id="fileInputExam" accept="image/*" style="display:none">

    <div class="params">
      <label for="examConfRange">conf 阈值</label>
      <input type="range" id="examConfRange" min="0" max="1" step="0.05" value="0.3">
      <output id="examConfOut">0.3</output>

      <label for="examImgszRange">imgsz</label>
      <input type="range" id="examImgszRange" min="320" max="2048" step="32" value="1024">
      <output id="examImgszOut">1024</output>

      <label for="examLineRange">框线粗细</label>
      <input type="range" id="examLineRange" min="1" max="20" step="1" value="5">
      <output id="examLineOut">5</output>

      <label for="examFontRange">标签字号</label>
      <input type="range" id="examFontRange" min="8" max="50" step="1" value="20">
      <output id="examFontOut">20</output>
    </div>

    <div class="params">
      <label>放大模式</label>
      <div>
        <label><input type="radio" name="expandMode" value="pixel" checked> 像素</label>
        <label><input type="radio" name="expandMode" value="ratio"> 比例</label>
      </div>
      <span></span>

      <label for="examExpandTop">顶部</label>
      <input type="number" id="examExpandTop" value="5" step="0.05">
      <span id="examExpandTopUnit">px</span>

      <label for="examExpandBottom">底部</label>
      <input type="number" id="examExpandBottom" value="5" step="0.05">
      <span id="examExpandBottomUnit">px</span>

      <label for="examExpandLeft">左侧</label>
      <input type="number" id="examExpandLeft" value="20" step="0.05">
      <span id="examExpandLeftUnit">px</span>

      <label for="examExpandRight">右侧</label>
      <input type="number" id="examExpandRight" value="20" step="0.05">
      <span id="examExpandRightUnit">px</span>

      <label for="examRegex">题号正则</label>
      <input type="text" id="examRegex" value="^\s*\d+\." size="30">
      <span></span>
    </div>

    <button id="submitExamBtn" disabled>开始识别</button>

    <div id="examStatus" class="status"></div>

    <h2 id="examSummary" style="display:none">识别结果</h2>
    <div id="examTotalTime" class="exam-total-time" style="display:none"></div>

    <h3 id="examYoloTitle" style="display:none">YOLO 初始标注</h3>
    <img id="examYoloImg" style="display:none; max-width:100%; border:1px solid #ddd; margin-bottom:12px;">

    <div class="result" id="examResult" style="display:none">
      <div>
        <p>题目标注图:</p>
        <img id="examAnnotatedImg">
        <p><a id="examDownloadLink" download="exam_annotated.jpg">下载标注图</a></p>
      </div>
      <div>
        <p>原图:</p>
        <img id="examOriginalImg">
      </div>
    </div>

    <h3 id="examCropsTitle" style="display:none">裁切区域</h3>
    <div id="examCropsGrid" class="crops-grid"></div>

    <h3 id="examOcrTitle" style="display:none">OCR 识别结果</h3>
    <table id="examOcrTable" style="display:none">
      <thead><tr><th>#</th><th>裁切图</th><th>识别文本</th><th>置信度</th><th>题目?</th></tr></thead>
      <tbody></tbody>
    </table>

    <h3 id="examStagesTitle" style="display:none">阶段耗时</h3>
    <table id="examStagesTable" style="display:none">
      <thead><tr><th>阶段</th><th>耗时 (ms)</th><th>结果</th><th>错误</th></tr></thead>
      <tbody></tbody>
    </table>

    <h3 id="examQuestionsTitle" style="display:none">题目列表</h3>
    <table id="examQuestionsTable" style="display:none">
      <thead><tr><th>#</th><th>题号文本</th><th>坐标 (x1,y1,x2,y2)</th><th>置信度</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const summary = document.getElementById('summary');
    const result = document.getElementById('result');
    const detectionTable = document.getElementById('detectionTable');

    let selectedFile = null;

    function showStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = 'status show ' + kind;
    }

    function hideStatus() {
      statusEl.className = 'status';
    }

    // Update slider outputs
    ['confRange', 'imgszRange', 'lineRange', 'fontRange',
     'examConfRange', 'examImgszRange', 'examLineRange', 'examFontRange'].forEach(id => {
      const out = document.getElementById(id.replace('Range', 'Out'));
      const slider = document.getElementById(id);
      slider.addEventListener('input', () => out.value = slider.value);
    });

    // Drag and drop
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragging');
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(f) {
      if (!f.type.startsWith('image/')) {
        showStatus('请上传图片文件', 'error');
        return;
      }
      selectedFile = f;
      dropZone.textContent = f.name + ' (' + Math.round(f.size / 1024) + ' KB)';
      submitBtn.disabled = false;
      hideStatus();
    }

    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      submitBtn.disabled = true;
      showStatus('推理中...(CPU 模式下预计 5-15 秒)', 'loading');
      summary.style.display = 'none';
      result.style.display = 'none';
      detectionTable.style.display = 'none';

      const form = new FormData();
      form.append('file', selectedFile);
      form.append('conf', document.getElementById('confRange').value);
      form.append('imgsz', document.getElementById('imgszRange').value);
      form.append('line_width', document.getElementById('lineRange').value);
      form.append('font_size', document.getElementById('fontRange').value);

      try {
        const r = await fetch('/predict', { method: 'POST', body: form });
        if (!r.ok) {
          const err = await r.json().catch(() => ({detail: r.statusText}));
          showStatus('错误: ' + (err.detail || r.status), 'error');
          submitBtn.disabled = false;
          return;
        }
        const data = await r.json();
        document.getElementById('annotatedImg').src = data.annotated_image;
        document.getElementById('originalImg').src = URL.createObjectURL(selectedFile);
        document.getElementById('downloadLink').href = data.annotated_image;

        summary.style.display = 'block';
        summary.textContent = `检测结果: ${data.num_detections} 个区域,耗时 ${data.inference_time_ms}ms`;
        result.style.display = 'grid';

        const tbody = detectionTable.querySelector('tbody');
        tbody.innerHTML = '';
        data.detections.forEach(d => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${d.id + 1}</td><td>${d.class_name}</td><td>${d.score.toFixed(3)}</td><td>[${d.bbox_xyxy.map(v => v.toFixed(1)).join(', ')}]</td>`;
          tbody.appendChild(row);
        });
        detectionTable.style.display = data.detections.length > 0 ? 'table' : 'none';

        showStatus('完成', 'success');
      } catch (e) {
        showStatus('请求失败: ' + e.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // ===== 试卷模式 =====
    const examDropZone = document.getElementById('dropZoneExam');
    const examFileInput = document.getElementById('fileInputExam');
    const examSubmitBtn = document.getElementById('submitExamBtn');
    const examStatusEl = document.getElementById('examStatus');
    const examSummary = document.getElementById('examSummary');
    const examResult = document.getElementById('examResult');
    const examStagesTitle = document.getElementById('examStagesTitle');
    const examTotalTimeEl = document.getElementById('examTotalTime');
    // Captured at "开始识别" click; consumed by renderExamResult. wall-clock ms.
    let examStartTime = null;
    const examStagesTable = document.getElementById('examStagesTable');
    const examQuestionsTitle = document.getElementById('examQuestionsTitle');
    const examQuestionsTable = document.getElementById('examQuestionsTable');

    let examFile = null;

    function showExamStatus(text, kind) {
      examStatusEl.textContent = text;
      examStatusEl.className = 'status show ' + kind;
    }
    function hideExamStatus() { examStatusEl.className = 'status'; }

    // Tab switching
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tab-general').style.display = tab === 'general' ? '' : 'none';
        document.getElementById('tab-exam').style.display = tab === 'exam' ? '' : 'none';
      });
    });

    // Mode toggle → update unit labels
    function updateUnitLabels() {
      const mode = document.querySelector('input[name="expandMode"]:checked').value;
      const unit = mode === 'pixel' ? 'px' : '比例';
      ['examExpandTop', 'examExpandBottom', 'examExpandLeft', 'examExpandRight'].forEach(id => {
        document.getElementById(id + 'Unit').textContent = unit;
      });
    }
    document.querySelectorAll('input[name="expandMode"]').forEach(r => {
      r.addEventListener('change', updateUnitLabels);
    });
    updateUnitLabels();

    // Drag & drop for exam
    examDropZone.addEventListener('click', () => examFileInput.click());
    examDropZone.addEventListener('dragover', e => { e.preventDefault(); examDropZone.classList.add('dragging'); });
    examDropZone.addEventListener('dragleave', () => examDropZone.classList.remove('dragging'));
    examDropZone.addEventListener('drop', e => {
      e.preventDefault();
      examDropZone.classList.remove('dragging');
      const f = e.dataTransfer.files[0];
      if (f) setExamFile(f);
    });
    examFileInput.addEventListener('change', () => {
      if (examFileInput.files[0]) setExamFile(examFileInput.files[0]);
    });

    function setExamFile(f) {
      if (!f.type.startsWith('image/')) {
        showExamStatus('请上传图片文件', 'error');
        return;
      }
      examFile = f;
      examDropZone.textContent = f.name + ' (' + Math.round(f.size / 1024) + ' KB)';
      examSubmitBtn.disabled = false;
      hideExamStatus();
    }

    examSubmitBtn.addEventListener('click', async () => {
      if (!examFile) return;
      examSubmitBtn.disabled = true;
      // Wall-clock timer for "开始检测 → 最终结果"
      examStartTime = performance.now();
      examTotalTimeEl.style.display = 'none';
      examTotalTimeEl.textContent = '';
      showExamStatus('提交任务...', 'loading');
      examSummary.style.display = 'none';
      document.getElementById('examYoloTitle').style.display = 'none';
      document.getElementById('examYoloImg').style.display = 'none';
      examResult.style.display = 'none';
      document.getElementById('examCropsTitle').style.display = 'none';
      document.getElementById('examCropsGrid').innerHTML = '';
      document.getElementById('examOcrTitle').style.display = 'none';
      document.getElementById('examOcrTable').style.display = 'none';
      examStagesTitle.style.display = 'none';
      examStagesTable.style.display = 'none';
      examQuestionsTitle.style.display = 'none';
      examQuestionsTable.style.display = 'none';

      const form = new FormData();
      form.append('file', examFile);
      form.append('expand_mode', document.querySelector('input[name="expandMode"]:checked').value);
      form.append('expand_top', document.getElementById('examExpandTop').value);
      form.append('expand_bottom', document.getElementById('examExpandBottom').value);
      form.append('expand_left', document.getElementById('examExpandLeft').value);
      form.append('expand_right', document.getElementById('examExpandRight').value);
      form.append('question_regex', document.getElementById('examRegex').value);
      form.append('conf', document.getElementById('examConfRange').value);
      form.append('imgsz', document.getElementById('examImgszRange').value);
      form.append('line_width', document.getElementById('examLineRange').value);
      form.append('font_size', document.getElementById('examFontRange').value);

      try {
        const r = await fetch('/predict/exam', { method: 'POST', body: form });
        if (!r.ok) {
          const err = await r.json().catch(() => ({detail: r.statusText}));
          showExamStatus('提交失败: ' + (err.detail || r.status), 'error');
          examSubmitBtn.disabled = false;
          return;
        }
        const submit = await r.json();
        showExamStatus('任务已提交，ID=' + submit.task_id + '，等待处理...', 'loading');

        // Poll
        const deadline = Date.now() + 5 * 60 * 1000;
        while (Date.now() < deadline) {
          await new Promise(res => setTimeout(res, 1000));
          const sr = await fetch(submit.submit_url);
          if (!sr.ok) {
            showExamStatus('查询失败: ' + sr.status, 'error');
            examSubmitBtn.disabled = false;
            return;
          }
          const status = await sr.json();
          if (status.status === 'done') {
            renderExamResult(status);
            return;
          }
          if (status.status === 'failed') {
            showExamStatus('任务失败: ' + (status.error || 'unknown'), 'error');
            examSubmitBtn.disabled = false;
            return;
          }
          showExamStatus('处理中...当前阶段=' + (status.progress || 'queued'), 'loading');
        }
        showExamStatus('任务超时', 'error');
        examSubmitBtn.disabled = false;
      } catch (e) {
        showExamStatus('请求失败: ' + e.message, 'error');
        examSubmitBtn.disabled = false;
      }
    });

    function renderExamResult(status) {
      const final = status.final;
      document.getElementById('examAnnotatedImg').src = final.annotated_image;
      document.getElementById('examOriginalImg').src = final.original_image;
      document.getElementById('examDownloadLink').href = final.annotated_image;
      examSummary.style.display = 'block';
      examSummary.textContent = `识别结果: ${final.questions.length} 个题目`;
      // Total wall-clock duration: click on 开始识别 → final rendered.
      if (examStartTime !== null) {
        const elapsedSec = ((performance.now() - examStartTime) / 1000).toFixed(2);
        examTotalTimeEl.textContent = `总耗时 ${elapsedSec} 秒`;
        examTotalTimeEl.style.display = 'inline-block';
      }
      examResult.style.display = 'grid';

      // YOLO initial annotated image
      if (final.yolo_annotated) {
        document.getElementById('examYoloImg').src = final.yolo_annotated;
        document.getElementById('examYoloImg').style.display = 'block';
        document.getElementById('examYoloTitle').style.display = 'block';
      }

      // Crop grid
      const cropsGrid = document.getElementById('examCropsGrid');
      cropsGrid.innerHTML = '';
      const blocks = final.ocr_blocks || [];
      blocks.forEach(b => {
        const div = document.createElement('div');
        div.className = 'crop-item';
        div.innerHTML = (b.crop_image
          ? `<img src="${b.crop_image}" alt="crop #${b.source_detection_id}">`
          : `<div style="width:180px;height:40px;background:#eee;line-height:40px;text-align:center;color:#999;">(无图像)</div>`) +
          `<div class="crop-txt">${(b.text || '').slice(0, 60) || '(空)'}</div>`;
        cropsGrid.appendChild(div);
      });
      if (blocks.length > 0) {
        document.getElementById('examCropsTitle').textContent = `裁切区域 (${blocks.length} 张)`;
        document.getElementById('examCropsTitle').style.display = 'block';
      }

      // OCR results table
      const ocrTbody = document.getElementById('examOcrTable').querySelector('tbody');
      ocrTbody.innerHTML = '';
      blocks.forEach((b, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${i + 1}</td>` +
          `<td>${b.crop_image ? `<img src="${b.crop_image}" style="max-width:120px;max-height:50px;">` : '-'}</td>` +
          `<td>${(b.text || '').slice(0, 80)}</td>` +
          `<td>${b.score.toFixed(3)}</td>` +
          `<td>${b.is_question ? '是' : ''}</td>`;
        ocrTbody.appendChild(row);
      });
      if (blocks.length > 0) {
        document.getElementById('examOcrTitle').style.display = 'block';
        document.getElementById('examOcrTable').style.display = 'table';
      }

      // Stages table
      const stagesTbody = examStagesTable.querySelector('tbody');
      stagesTbody.innerHTML = '';
      for (const [name, stage] of Object.entries(status.stages)) {
        const row = document.createElement('tr');
        const result = stage.payload ? JSON.stringify(stage.payload) : '-';
        row.innerHTML = `<td>${name}</td><td>${stage.duration_ms ?? '-'}</td><td>${result}</td><td>${stage.error || ''}</td>`;
        stagesTbody.appendChild(row);
      }
      examStagesTitle.style.display = 'block';
      examStagesTable.style.display = 'table';

      // Questions table
      const qTbody = examQuestionsTable.querySelector('tbody');
      qTbody.innerHTML = '';
      final.questions.forEach(q => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${q.index}</td><td>${(q.matched_text || '').slice(0, 50)}</td>` +
          `<td>[${q.bbox_xyxy.map(v => v.toFixed(1)).join(', ')}]</td><td>${q.ocr_score.toFixed(3)}</td>`;
        qTbody.appendChild(row);
      });
      examQuestionsTitle.style.display = final.questions.length > 0 ? 'block' : 'none';
      examQuestionsTable.style.display = final.questions.length > 0 ? 'table' : 'none';

      showExamStatus('完成', 'success');
      examSubmitBtn.disabled = false;
    }
  </script>
</body>
</html>
